name: Khatam Asraru - FULL OCR Washal
on: workflow_dispatch
permissions: { contents: write }
jobs:
  khatam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pymupdf==1.24.9 pillow google-generativeai
      - name: OCR Batch 5 Halaman + Rajah 300 DPI
        env:
          KITAB_API_KEY: ${{ secrets.KITAB_API_KEY }}
        run: |
          cat > run.py << 'PY'
          import fitz, os, io, base64
          import google.generativeai as genai
          from PIL import Image
          genai.configure(api_key=os.environ["KITAB_API_KEY"])
          model = genai.GenerativeModel("gemini-2.5-pro")
          pdf = [f for f in os.listdir(".") if f.lower().endswith(".pdf")][0]
          doc = fitz.open(pdf)
          os.makedirs("rajah", exist_ok=True)
          batch_size=5
          for b in range(0, len(doc), batch_size):
              out=f"BATCH_{b//batch_size+1:02d}.md"
              if os.path.exists(out): continue
              with open(out,"w",encoding="utf-8") as md:
                md.write(f"# BATCH {b//batch_size+1} Halaman {b+1}-{min(b+batch_size,len(doc))}\n\n")
                for p in range(b, min(b+batch_size,len(doc))):
                  page=doc[p]
                  # render 300 DPI
                  pix=page.get_pixmap(dpi=300)
                  img=Image.frombytes("RGB",[pix.width,pix.height],pix.samples)
                  # crop rajah jika ada gambar kotak
                  for i, img_info in enumerate(page.get_images()):
                      try:
                          xref=img_info[0]
                          pix2=fitz.Pixmap(doc,xref)
                          if pix2.width>100 and pix2.height>100:
                              pix2.save(f"rajah/rajah_p{p+1}_{i}.png")
                      except: pass
                  prompt=f"""
                  TOLONG TERJEMAHKAN HALAMAN CETAK {p+1} DARI KITAB Asraru Sulaimaniyyah INI 100% LENGKAP TANPA RINGKASAN.
                  WAJIB 3 BLOK BERURUTAN PER PARAGRAF:
                  1. [Teks Arab Asli] RTL berharakat lengkap, salin UTUH
                  2. [Transliterasi Latin Fonetik 100% Washal Ulama] WAJIB lengkap tanpa... Contoh WAJIB: minal-, fil-, bil-, lil-, ilal-, 'anil-, 'alal-, wal-, fal-, wallaahu, Bismillaahir-Rahmaanir-Rahiim, asy-Syamsi, ath-Thawri, lisy-Syamsi, liz-Zuharati, tasquthul-ba'dhu, mawtil-athfaali, dzakaral-'ulamaa'u, li-zhuhuuril-aabaari, li-Zuhala, li-'Uthaarida. Leburkan syamsiyah, pertahankan qamariyah. JANGAN dipotong.
                  3. [Terjemahan Indonesia] Matan murni jelas, istilah hikmah/falak/thibb/raml tetap + penjelasan dalam kurung.
                  DILARANG pakai... atau meringkas. Jika ada rajah/wafaq/tilsam, tulis [RAJAH HAL {p+1}].
                  """
                  resp=model.generate_content([prompt, img])
                  md.write(f"## Halaman Cetak {p+1}\n\n{resp.text}\n\n---\n\n")
                  print(f"Hal {p+1} selesai")
              break # jalan 1 batch dulu biar gak habis kuota
          PY
          python run.py
      - run: |
          git config user.name "Cang May Bot"
          git config user.email "bot@cangmay.id"
          git add BATCH_*.md rajah/
          git commit -m "BATCH FULL OCR Washal Ulama - fix" || true
          git push
